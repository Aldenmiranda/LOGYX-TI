<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradiente Azul a Cian -->
    <linearGradient id="favFavGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Fondo Oscuro Sólido -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Base cuadrada redondeada con fondo oscuro -->
  <rect width="100" height="100" rx="20" fill="url(#bgGrad)" stroke="#3B82F6" stroke-width="4" />

  <!-- Letra 'L' estilizada sólida -->
  <path d="M 22 20 
           L 44 20 
           L 44 60 
           L 78 60 
           L 78 80 
           L 22 80 Z" fill="url(#favFavGrad)" />

  <!-- Cubo/Activo brillante superior -->
  <rect x="52" y="20" width="26" height="26" rx="6" fill="#38BDF8" />
  
  <!-- Punto blanco de alto brillo -->
  <circle cx="65" cy="33" r="5" fill="#FFFFFF" />
</svg>